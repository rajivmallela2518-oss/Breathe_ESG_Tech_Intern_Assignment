services:
  - type: web
    name: breathe-esg-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py loaddata emissions/fixtures/emission_factors.json && python manage.py create_demo_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: breathe-esg-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: breathe-esg-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: breathe-esg-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: breathe-esg-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: breathe-esg-db
          property: port
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: breathe-esg-db
    databaseName: breathe_esg
    user: breathe_esg
